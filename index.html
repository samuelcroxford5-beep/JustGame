<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>JustGame</title>

<style>
body{
margin:0;
background:#0f172a;
font-family:Arial,sans-serif;
color:white;
}

header{
background:#111827;
padding:20px;
text-align:center;
}

h1{
margin:0;
font-size:3rem;
}

.search{
width:80%;
max-width:600px;
padding:12px;
margin-top:15px;
border:none;
border-radius:10px;
}

.grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
gap:20px;
padding:30px;
}

.card{
background:#1e293b;
padding:20px;
border-radius:15px;
text-align:center;
transition:.3s;
}

.card:hover{
transform:scale(1.05);
}

.btn{
display:inline-block;
margin-top:10px;
padding:10px 20px;
background:#3b82f6;
color:white;
text-decoration:none;
border-radius:10px;
}

footer{
text-align:center;
padding:20px;
color:gray;
}
</style>
</head>

<body>

<header>
<h1>🎮 JustGame</h1>
<p>Play Games. Learn. Explore.</p>
<input class="search" placeholder="Search games...">
</header>

<div class="grid">

<div class="card">
<h2>2048</h2>
<p>Classic puzzle game.</p>
<a class="btn" href="https://play2048.co/" target="_blank">Play</a>
</div>

<div class="card">
<h2>GeoGuessr</h2>
<p>Guess locations around the world.</p>
<a class="btn" href="https://www.geoguessr.com/" target="_blank">Play</a>
</div>

<div class="card">
<h2>Chess</h2>
<p>Play chess online.</p>
<a class="btn" href="https://www.chess.com/play" target="_blank">Play</a>
</div>

<div class="card">
<h2>Skribbl.io</h2>
<p>Draw and guess.</p>
<a class="btn" href="https://skribbl.io" target="_blank">Play</a>
</div>

<div class="card">
<h2>NASA</h2>
<p>Explore space videos.</p>
<a class="btn" href="https://www.nasa.gov" target="_blank">Visit</a>
</div>

<div class="card">
<h2>YouTube Learning</h2>
<p>Documentaries and learning.</p>
<a class="btn" href="https://www.youtube.com" target="_blank">Watch</a>
</div>

</div>

<footer>
JustGame © 2026
</footer>

</body>
</html>
